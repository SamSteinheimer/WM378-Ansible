# Push the generated configs to the routers
- hosts: all
  gather_facts: false
  tasks:
  
    - name: Ensure configs dir exists
      ansible.builtin.file:
        path: configs
        state: directory
      delegate_to: localhost
      run_once: true

    - name: Push config
      arista.eos.eos_config:
        src: "configs/{{ inventory_hostname }}.cfg"
        save_when: modified