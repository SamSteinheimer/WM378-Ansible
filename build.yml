# Generate a config file for every router into configs/
- hosts: all
  gather_facts: false
  tasks:
    - name: Ensure configs dir exists
      ansible.builtin.file:
        path: configs
        state: directory
      delegate_to: localhost
      run_once: true
      
    - name: Render config
      ansible.builtin.template:
        src: templates/router.j2
        dest: "configs/{{ inventory_hostname }}.cfg"
